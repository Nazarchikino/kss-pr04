    Order:
      type: object
      description: Замовлення в їдальні коледжу
      required: [id, customerId, status, totalAmount, pickupCode, comment, createdAt, issuedAt]
      properties:
        id:
          type: integer
          readOnly: true
        customerId:
          type: integer
          readOnly: true
        status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
          readOnly: true
        totalAmount:
          type: number
          minimum: 0
          readOnly: true
        pickupCode:
          type: string
          readOnly: true
        comment:
          type: [string, "null"]
          maxLength: 200
        createdAt:
          type: string
          format: date-time
          readOnly: true
        issuedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
      example:
        id: 42
        customerId: 15
        status: accepted
        totalAmount: 110.0
        pickupCode: A-042
        comment: Без цибулі, будь ласка
        createdAt: "2026-10-18T11:45:00Z"
        issuedAt: null

    CreateOrderRequest:
      type: object
      description: Запит на створення нового замовлення з початковим переліком страв
      required: [items]
