# Специфікація OpenAPI 3.1 до практичної роботи № 4.
# Варіант № 8. Інформаційна система «Їдальня коледжу» (College Canteen API).
# Перевірка: npm run lint · документація: npm run docs · імітаційний сервер: npm run mock
openapi: 3.1.0
info:
  title: Їдальня коледжу API
  version: 1.0.0
  summary: REST API інформаційної системи їдальні коледжу для керування стравами, денним меню та замовленнями
  description: |
    Варіант № 8. Виконав: Дерев’янчук Назар, група 456-Д.

    **Домовленості:** шляхи від `/api/v1`; ресурси – іменники в множині (kebab-case);
    JSON у camelCase; дати – ISO 8601; колекції – сторінками `{ items, page, pageSize, total }`;
    помилки – `application/problem+json` (RFC 9457); автентифікація – `Authorization: Bearer <токен>`.
    Читання окремого ресурсу (`GET`) підтримує умовні запити через `ETag` / `If-None-Match` (`304 Not Modified`),
    а часткове оновлення (`PATCH`) – оптимістичне блокування через `If-Match` (`412 Precondition Failed`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Локальний сервер розробки
tags:
  - name: auth
    description: Автентифікація користувачів і видача токенів
  - name: orders
    description: Замовлення в їдальні, позиції замовлень і зміна їхнього стану
  - name: dishes
    description: Каталог страв та напоїв їдальні
  - name: menus
    description: Щоденне меню їдальні (сніданки та обіди)
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вхід у систему
      x-kss-action: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вхід успішний
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список замовлень з фільтрацією, сортуванням і пагінацією
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          description: Фільтр за станом замовлення
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: customerId
          in: query
          description: Фільтр за ідентифікатором замовника
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          description: Поле сортування (префікс `-` для спадання)
          schema:
            type: string
            enum: [createdAt, -createdAt, totalAmount, -totalAmount]
            default: -createdAt
      responses:
        "200":
          description: Сторінка списку замовлень
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [orders]
      operationId: createOrder
      summary: Створити нове замовлення в їдальні
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Замовлення успішно створено (початковий стан accepted)
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      operationId: getOrder
      summary: Отримати замовлення за ідентифікатором (підтримує ETag)
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Детальні дані замовлення
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "304":
          description: Замовлення не змінювалося (використовуйте кешовану копію)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: Частково оновити замовлення (коментар до початку приготування)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Замовлення успішно оновлено
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [orders]
      operationId: deleteOrder
      summary: Видалити замовлення (дозволено у стані accepted або адміністратором)
      responses:
        "204":
          description: Замовлення успішно видалено (No Content)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders/{orderId}/items:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      operationId: listOrderItems
      summary: Список позицій конкретного замовлення (вкладена колекція)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sort
          in: query
          description: Сортування позицій замовлення
          schema:
            type: string
            enum: [id, -lineTotal]
            default: id
      responses:
        "200":
          description: Сторінка позицій замовлення
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [orders]
      operationId: addOrderItem
      summary: Додати нову страву (позицію) до замовлення у стані accepted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderItemRequest"
      responses:
        "201":
          description: Позицію додано до замовлення
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /orders/{orderId}/status:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Змінити стан замовлення (прийнято -> готується -> видано; видає лише кухар)
      x-kss-action: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Стан замовлення успішно змінено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /dishes:
    get:
      tags: [dishes]
      operationId: listDishes
      summary: Список страв у каталозі їдальні
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category
          in: query
          description: Фільтр за категорією страви
          schema:
            $ref: "#/components/schemas/DishCategory"
        - name: isAvailable
          in: query
          description: Фільтр за наявністю страви для замовлення
          schema:
            type: boolean
        - name: maxPrice
          in: query
          description: Максимальна ціна страви (грн)
          schema:
            type: number
            minimum: 1
        - name: sort
          in: query
          description: Сортування страв
          schema:
            type: string
            enum: [name, -name, price, -price, -createdAt]
            default: name
      responses:
        "200":
          description: Сторінка каталогу страв
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [dishes]
      operationId: createDish
      summary: Додати нову страву до каталогу їдальні (лише кухар або адмін)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDishRequest"
      responses:
        "201":
          description: Страву створено
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /dishes/{dishId}:
    parameters:
      - $ref: "#/components/parameters/DishId"
    get:
      tags: [dishes]
      operationId: getDish
      summary: Отримати інформацію про страву за ідентифікатором (підтримує ETag)
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Картка страви
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
        "304":
          description: Картка страви не змінювалася
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [dishes]
      operationId: updateDish
      summary: Частково оновити страву (ціна, вихід або доступність; лише кухар)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDishRequest"
      responses:
        "200":
          description: Страву оновлено
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dish"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [dishes]
      operationId: deleteDish
      summary: Видалити страву з каталогу (лише кухар або адмін)
      responses:
        "204":
          description: Страву видалено (No Content)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /menus:
    get:
      tags: [menus]
      operationId: listMenus
      summary: Список денних меню їдальні
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: menuDate
          in: query
          description: Фільтр за датою меню (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: mealType
          in: query
          description: Фільтр за типом прийому їжі (сніданок чи обід)
          schema:
            $ref: "#/components/schemas/MealType"
        - name: sort
          in: query
          description: Сортування за датою меню
          schema:
            type: string
            enum: [menuDate, -menuDate]
            default: -menuDate
      responses:
        "200":
          description: Сторінка денних меню
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [menus]
      operationId: createMenu
      summary: Опублікувати денне меню на дату (лише кухар або адмін)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuRequest"
      responses:
        "201":
          description: Меню створено
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен, отриманий через POST /auth/login

  parameters:
    Page:
      name: page
      in: query
      description: Номер сторінки (з 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Кількість елементів на сторінці
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    OrderId:
      name: orderId
      in: path
      required: true
      description: Унікальний ідентифікатор замовлення
      schema:
        type: integer
        minimum: 1
    DishId:
      name: dishId
      in: path
      required: true
      description: Унікальний ідентифікатор страви
      schema:
        type: integer
        minimum: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Тег версії ресурсу (ETag) для умовного запиту читання (304 Not Modified)
      schema:
        type: string
      example: '"v1-order-42-accepted"'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Очікуваний ETag ресурсу для захисту від втрати оновлень (412 Precondition Failed)
      schema:
        type: string
      example: '"v1-order-42-accepted"'

  headers:
    Location:
      description: Адреса створеного ресурсу
      schema:
        type: string
        format: uri-reference
      example: /api/v1/orders/42
    ETag:
      description: Ідентифікатор поточної версії ресурсу для кешування та оптимістичного блокування
      schema:
        type: string
      example: '"v1-order-42-accepted"'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
      example:
        email: student@college.example.ua
        password: student123

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
      example:
        accessToken: 2f1c9a54-8d3e-4b7a-9f1e-6c2d8a4b0e71
        tokenType: Bearer
        expiresIn: 3600

    DishCategory:
      type: string
      description: Категорія страви в меню їдальні
      enum: [first_course, main_course, side_dish, salad, dessert, drink]
      example: first_course

    MealType:
      type: string
      description: Тип прийому їжі (сніданок або комплексний обід)
      enum: [breakfast, lunch]
      example: lunch

    OrderStatus:
      type: string
      description: Стан життєвого циклу замовлення в їдальні
      enum: [accepted, preparing, issued, cancelled]
      example: accepted

    Dish:
      type: object
      description: Страва або напій у каталозі їдальні коледжу
      required: [id, name, category, price, weightGrams, calories, isAvailable, allergens, createdAt]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          minLength: 2
          maxLength: 100
        category:
          $ref: "#/components/schemas/DishCategory"
        price:
          type: number
          exclusiveMinimum: 0
          description: Ціна за порцію у гривнях
        weightGrams:
          type: integer
          minimum: 10
          maximum: 2000
          description: Вихід порції у грамах (або мілілітрах)
        calories:
          type: [integer, "null"]
          minimum: 0
          description: Енергетична цінність (ккал на порцію)
        isAvailable:
          type: boolean
          description: Чи доступна страва для замовлення сьогодні
        allergens:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 101
        name: Борщ український зі сметаною та пампушками
        category: first_course
        price: 55.0
        weightGrams: 350
        calories: 290
        isAvailable: true
        allergens: [gluten, lactose]
        createdAt: "2026-10-18T08:00:00Z"

    CreateDishRequest:
      type: object
      description: Запит на додавання нової страви до каталогу
      required: [name, category, price, weightGrams]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        category:
          $ref: "#/components/schemas/DishCategory"
        price:
          type: number
          exclusiveMinimum: 0
        weightGrams:
          type: integer
          minimum: 10
          maximum: 2000
        calories:
          type: [integer, "null"]
          minimum: 0
        isAvailable:
          type: boolean
          default: true
        allergens:
          type: array
          items:
            type: string
      example:
        name: Котлета по-київськи з картопляним пюре
        category: main_course
        price: 78.5
        weightGrams: 280
        calories: 460
        isAvailable: true
        allergens: [gluten, lactose, eggs]

    UpdateDishRequest:
      type: object
      description: Запит на часткове оновлення страви (щонайменше 1 поле)
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        category:
          $ref: "#/components/schemas/DishCategory"
        price:
          type: number
          exclusiveMinimum: 0
        weightGrams:
          type: integer
          minimum: 10
          maximum: 2000
        calories:
          type: [integer, "null"]
          minimum: 0
        isAvailable:
          type: boolean
        allergens:
          type: array
          items:
            type: string
      example:
        price: 60.0
        isAvailable: true

    DishPage:
      type: object
      description: Сторінка списку страв
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dish"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      example:
        items:
          - id: 101
            name: Борщ український зі сметаною та пампушками
            category: first_course
            price: 55.0
            weightGrams: 350
            calories: 290
            isAvailable: true
            allergens: [gluten, lactose]
            createdAt: "2026-10-18T08:00:00Z"
