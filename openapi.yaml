            createdAt: "2026-10-18T11:45:00Z"
            issuedAt: null
        page: 1
        pageSize: 10
        total: 1

    ProblemDetails:
      type: object
      description: Опис помилки за RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      example:
        type: about:blank
        title: Конфлікт зі станом ресурсу
        status: 409
        detail: Замовлення №42 перебуває у стані accepted; видача (issued) можлива лише після стану preparing
        instance: /api/v1/orders/42/status

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
      example:
        type: about:blank
        title: Дані не пройшли перевірку
        status: 422
        detail: Помилка валідації полів запиту
        instance: /api/v1/orders
        errors:
          - field: items
            message: Замовлення має містити щонайменше 1 позицію

  responses:
    BadRequest:
      description: Некоректний запит
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Некоректний запит
            status: 400
            detail: Синтаксична помилка JSON або некоректне значення параметра запиту (page >= 1)
            instance: /api/v1/orders
    Unauthorized:
      description: Відсутній або недійсний токен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Відсутній або недійсний токен
            status: 401
            detail: Для виконання запиту необхідний заголовок Authorization Bearer <токен>
            instance: /api/v1/orders
    Forbidden:
      description: Недостатньо прав (обмеження за роллю кухаря або власника замовлення)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Недостатньо прав
            status: 403
            detail: Видача замовлення (issued) та керування меню дозволені лише користувачам із роллю cook
            instance: /api/v1/orders/42/status
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Ресурс не знайдено
            status: 404
            detail: Замовлення з id=999 не існує
            instance: /api/v1/orders/999
    Conflict:
      description: Конфлікт зі станом ресурсу (недопустимий перехід станів замовлення)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Конфлікт зі станом ресурсу
            status: 409
            detail: Замовлення №42 перебуває у стані accepted; видача (issued) можлива лише після стану preparing
            instance: /api/v1/orders/42/status
    PreconditionFailed:
      description: Передумова If-Match не виконана (ETag ресурсу змінився)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Передумова не виконана (Precondition Failed)
            status: 412
            detail: Версія замовлення змінилася (ETag не збігається із заголовком If-Match). Перечитайте ресурс перед оновленням
            instance: /api/v1/orders/42
    ValidationFailed:
      description: Дані не пройшли перевірку
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
          example:
            type: about:blank
            title: Дані не пройшли перевірку
            status: 422
            detail: Помилка валідації полів запиту
            instance: /api/v1/orders
            errors:
              - field: items
                message: Замовлення має містити щонайменше 1 позицію
